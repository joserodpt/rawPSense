<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2130"/>
      <stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="cog" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe3ff"/>
      <stop offset="1" stop-color="#1a6dff"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff4d1f"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#2c3346" stroke-width="1"/>

  <!-- cog: ring + 8 teeth -->
  <g fill="url(#cog)">
    <rect x="112" y="28" width="32" height="40" rx="7" transform="rotate(0 128 128)"/>
    <rect x="112" y="28" width="32" height="40" rx="7" transform="rotate(45 128 128)"/>
    <rect x="112" y="28" width="32" height="40" rx="7" transform="rotate(90 128 128)"/>
    <rect x="112" y="28" width="32" height="40" rx="7" transform="rotate(135 128 128)"/>
    <rect x="112" y="28" width="32" height="40" rx="7" transform="rotate(180 128 128)"/>
    <rect x="112" y="28" width="32" height="40" rx="7" transform="rotate(225 128 128)"/>
    <rect x="112" y="28" width="32" height="40" rx="7" transform="rotate(270 128 128)"/>
    <rect x="112" y="28" width="32" height="40" rx="7" transform="rotate(315 128 128)"/>
  </g>
  <circle cx="128" cy="128" r="72" fill="none" stroke="url(#cog)" stroke-width="30"/>
  <circle cx="128" cy="128" r="57" fill="#0e1118"/>

  <!-- energy bolt -->
  <path d="M142 44 L80 140 L120 140 L106 212 L176 110 L134 110 L152 44 Z"
        fill="url(#bolt)" stroke="#0e1118" stroke-width="8" stroke-linejoin="round" paint-order="stroke"/>
</svg>
